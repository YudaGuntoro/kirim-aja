name: kirimaja
services:
  app:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm start"
    ports:
      - "127.0.0.1:${DELIVERY_PORT:-3101}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Isi ADMIN_PASSWORD di .env}
    volumes:
      - ./package:/app
      - kirimaja_node_modules:/app/node_modules
      - kirimaja_data:/app/data
volumes:
  kirimaja_node_modules:
  kirimaja_data:
